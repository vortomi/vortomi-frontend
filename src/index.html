<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vortomi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Vortomi, el CRM de WhatsApp para tu empresa: todos tus números en una bandeja, un asistente que atiende y vende, y tu equipo organizado. Un servicio de Vortex Autonomy, C.A.">
  <meta name="application-name" content="Vortomi">
  <meta name="apple-mobile-web-app-title" content="Vortomi">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">

  <!-- Icons from the designer's isotipo (graphics/vortomi-icono). -->
  <link rel="icon" type="image/svg+xml" href="brand/isotipo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Link previews (WhatsApp, Facebook, Telegram...). Absolute URLs: update with the final domain. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vortomi">
  <meta property="og:locale" content="es_VE">
  <meta property="og:title" content="Vortomi · El CRM de WhatsApp para tu empresa">
  <meta property="og:description" content="Todos tus números en una bandeja, un asistente que atiende y vende, y tu equipo organizado.">
  <meta property="og:url" content="https://vortomi-production.up.railway.app/">
  <meta property="og:image" content="https://vortomi-production.up.railway.app/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo de Vortomi: El CRM de WhatsApp para tu empresa">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    // Light or dark before anything is painted (core/theme.ts keeps it in sync afterwards).
    try {
      var saved = localStorage.getItem('vortomi-theme');
      if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
